[project]
name = "vsc-administration"
version = "5.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Georges", email = "itkovian@gmail.com" }
]
requires-python = "==3.9.*"
dependencies = [
    "lockfile == 0.12.2",
    "vsc-accountpage-clients",
    "vsc-base",
    "vsc-config",
    "vsc-filesystems",
    "vsc-utils",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsc"]

[project.scripts]
create_tier2_ugent_home_data_directory_tree = "vsc.administration.cli:create_tier2_ugent_home_data_directory_tree_main"
sync_slurm_acct = "vsc.administration.cli:sync_slurm_acct_main"
sync_slurm_external_licenses = "vsc.administration.cli:sync_slurm_external_licenses_main"
sync_vsc_email_postfix = "vsc.administration.cli:sync_vsc_email_postfix_main"
sync_vsc_users = "vsc.administration.cli:sync_vsc_users_main"
replicate_scratch_tree = "vsc.administration.cli:replicate_scratch_tree_main"


[tool.uv.sources]
vsc-base = { git = "https://github.com/itkovian/vsc-base.git", branch = "uv-package-only"}
vsc-config = { git = "ssh://git@github.com/itkovian/vsc-config.git", branch = "uv-package-only"}
vsc-utils = { git = "https://github.com/itkovian/vsc-utils.git", branch = "uv-package-only"}
vsc-accountpage-clients = { git = "ssh://git@github.com/itkovian/vsc-accountpage-clients.git", branch = "uv-package-only"}
vsc-filesystems = { git = "https://github.com/itkovian/vsc-filesystems.git", branch = "uv-package-only"}
